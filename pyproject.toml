[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sectriage"
version = "0.1.0"
description = "LLM-powered security vulnerability triage agent"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.68.0",
]

[project.scripts]
sectriage = "sectriage.cli:main"

[tool.setuptools.packages.find]
include = ["sectriage*"]
